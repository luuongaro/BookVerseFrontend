<section aria-labelledby="friends-title">
  <h2 id="friends-title">Tus amigos en BookVerse</h2>
  @if (loading()) { <p role="status">Cargando amigos…</p> }
  @else if (error()) { <p role="alert">{{ error() }} <button type="button" (click)="load()">Reintentar</button></p> }
  @else if (!friends().length) { <p>Todavía no tenés amigos agregados.</p> }
  @else { <div class="friends">@for (friend of friends(); track friend.id) { <article class="friend-card"><app-user-avatar class="friend-avatar" [userId]="friend.userId" [username]="friend.username" /><h3>{{ friend.username }}</h3><a [routerLink]="['/users', friend.userId]">Ver perfil</a></article> }</div> }
</section>
