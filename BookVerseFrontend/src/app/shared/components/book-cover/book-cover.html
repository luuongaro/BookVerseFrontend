@if (src() && failedSrc() !== src()) {
  <img [src]="src()" [alt]="title()" loading="lazy" (error)="failedSrc.set(src())" />
} @else {
  <div
    class="book-cover-fallback"
    role="img"
    [attr.aria-label]="'Portada no disponible: ' + title()"
  >
    <span class="book-cover-fallback__title">{{ title() }}</span>
  </div>
}
